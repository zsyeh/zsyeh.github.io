name: Sync Halo and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [halo-published]
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: halo-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://blog.ehzsy.site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Route Halo API traffic to the origin
        run: echo "98.142.241.45 dxlab.ehzsy.space" | sudo tee -a /etc/hosts
      - name: Import published GitHub Issue
        if: github.event_name == 'issues'
        run: npm run issue:sync
      - name: Synchronize GitHub and Halo
        id: halo-sync
        continue-on-error: true
        env:
          HALO_URL: https://dxlab.ehzsy.space
          HALO_TOKEN: ${{ secrets.HALO_TOKEN }}
          REQUIRE_HALO_TOKEN: "1"
        run: npm run sync:bidirectional
      - name: Save synchronized content
        if: steps.halo-sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .halo-sync.json .sync src/content/blog public/halo-assets
          git diff --cached --quiet || git commit -m "content: sync Halo posts"
          git push
      - name: Build Astro
        run: npm run build
      - name: Deploy to GitHub Pages branch
        run: |
          PAGES_AUTH_HEADER="$(git config --get http.https://github.com/.extraheader)"
          git -C dist init -b gh-pages
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add --all
          git -C dist commit -m "deploy: ${GITHUB_SHA}"
          git -C dist -c http.https://github.com/.extraheader="$PAGES_AUTH_HEADER" push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
